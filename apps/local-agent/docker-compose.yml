services:
  codebase-researcher:
    build:
      context: ../..
      dockerfile: apps/local-agent/src/agents/codebase-researcher/Dockerfile
    environment:
      - SERVER_URL=${SERVER_URL}
      - AGENT_API_KEY=${CODEBASE_RESEARCHER_AGENT_API_KEY}
      - AGENT_ID=${CODEBASE_RESEARCHER_AGENT_ID:-codebase-researcher}
      - GIT_REPOSITORY_URL=${CODEBASE_RESEARCHER_GIT_REPOSITORY_URL}
      - GIT_BRANCH=${CODEBASE_RESEARCHER_GIT_BRANCH:-}
      - WORKING_DIRECTORY=${CODEBASE_RESEARCHER_WORKING_DIRECTORY:-/workspace}
      - MODEL=${CODEBASE_RESEARCHER_MODEL:-}
      - MAX_THINKING_TOKENS=${CODEBASE_RESEARCHER_MAX_THINKING_TOKENS:-}
    volumes:
      - ${HOME}/.claude/.credentials.json:/home/agent/.claude/.credentials.json:ro
      - ${HOME}/.gitconfig:/home/agent/.gitconfig:ro
      - ${HOME}/.config/gh:/home/agent/.config/gh:ro
    restart: unless-stopped

  web-researcher:
    build:
      context: ../..
      dockerfile: apps/local-agent/src/agents/web-researcher/Dockerfile
    environment:
      - SERVER_URL=${SERVER_URL}
      - AGENT_API_KEY=${WEB_RESEARCHER_AGENT_API_KEY}
      - AGENT_ID=${WEB_RESEARCHER_AGENT_ID:-web-researcher}
      - MODEL=${WEB_RESEARCHER_MODEL:-}
      - MAX_THINKING_TOKENS=${WEB_RESEARCHER_MAX_THINKING_TOKENS:-}
      - HTTP_PROXY=${WEB_RESEARCHER_HTTP_PROXY:-}
      - HTTPS_PROXY=${WEB_RESEARCHER_HTTPS_PROXY:-}
    volumes:
      - ${HOME}/.claude/.credentials.json:/home/agent/.claude/.credentials.json:ro
    restart: unless-stopped

  mock-agent:
    build:
      context: ../..
      dockerfile: apps/local-agent/src/agents/mock-agent/Dockerfile
    environment:
      - SERVER_URL=${SERVER_URL}
      - AGENT_API_KEY=${MOCK_AGENT_AGENT_API_KEY}
      - AGENT_ID=${MOCK_AGENT_AGENT_ID:-mock-agent}
      - MOCK_DELAY_MS=${MOCK_AGENT_DELAY_MS:-100}
      - MOCK_THINKING_ENABLED=${MOCK_AGENT_THINKING_ENABLED:-true}
      - MOCK_TOOL_CALLS=${MOCK_AGENT_TOOL_CALLS:-2}
    restart: unless-stopped

  claude-cli:
    build:
      context: ../..
      dockerfile: apps/local-agent/src/agents/claude-cli/Dockerfile
    environment:
      - SERVER_URL=${SERVER_URL}
      - AGENT_API_KEY=${CLAUDE_CLI_AGENT_API_KEY}
      - AGENT_ID=${CLAUDE_CLI_AGENT_ID:-claude-cli}
      - WORKING_DIRECTORY=${CLAUDE_CLI_WORKING_DIRECTORY:-/workspace}
      - MODEL=${CLAUDE_CLI_MODEL:-}
      - MAX_THINKING_TOKENS=${CLAUDE_CLI_MAX_THINKING_TOKENS:-}
      - MAX_TOKENS=${CLAUDE_CLI_MAX_TOKENS:-}
      - ALLOWED_TOOLS=${CLAUDE_CLI_ALLOWED_TOOLS:-}
      - DISALLOWED_TOOLS=${CLAUDE_CLI_DISALLOWED_TOOLS:-}
      - CUSTOM_SYSTEM_PROMPT=${CLAUDE_CLI_CUSTOM_SYSTEM_PROMPT:-}
      - PERMISSION_MODE=${CLAUDE_CLI_PERMISSION_MODE:-dangerously-skip-permissions}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ${CLAUDE_CLI_WORKSPACE:-./workspace}:/workspace
      - ${HOME}/.claude/.credentials.json:/home/agent/.claude/.credentials.json:ro
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
